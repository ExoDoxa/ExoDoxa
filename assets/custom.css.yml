/* Cambiar el fondo y colores */
body {
  background-color: #1a1a2e; /* Azul oscuro */
  color: #eaeaea; /* Blanco grisáceo para el texto */
  font-family: 'Arial', sans-serif;
}

/* Cambiar el color de los links */
a {
  color: #ffd700; /* Dorado */
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
  color: #ff4500; /* Naranja brillante al pasar el mouse */
}

/* Personalizar el encabezado */
header {
  background-color: #16213e;
  padding: 20px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
}

header h1 {
  color: #ffd700;
}

/* Estilo para las publicaciones */
.post {
  background-color: #0f3460;
  padding: 20px;
  margin: 20px 0;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
}

.post h2 {
  color: #e94560;
}

footer {
  background-color: #16213e;
  color: #ffd700;
  text-align: center;
  padding: 10px;
  margin-top: 40px;
}